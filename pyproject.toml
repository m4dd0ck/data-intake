[project]
name = "data-intake"
version = "1.0.0"
description = "First-day audit of client data exports: quality issues, joins, near-duplicates and supportable KPIs, as a shareable HTML report."
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.4",
    "jinja2>=3.1",
    "openpyxl>=3.1",
    "pydantic>=2.9",
    "rapidfuzz>=3.10",
    "rich>=13",
    "typer>=0.12",
]

[project.scripts]
intake = "data_intake.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8",
    "ruff>=0.8",
    "types-openpyxl>=3.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.mypy]
python_version = "3.12"
strict = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_intake"]
